<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbit Strike AR — Playable 3D Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #050811; font-family: 'Segoe UI', -apple-system, sans-serif; color: #fff; }
  #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  /* Sci-Fi Glass UI HUD */
  .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
  .interactive { pointer-events: auto; }
  
  .glass-panel { background: rgba(8, 16, 32, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.15); }
  
  /* Top Bar */
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
  .title-block h1 { font-size: 1.1rem; letter-spacing: 2px; color: #00f0ff; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6); }
  .title-block p { font-size: 0.75rem; color: #8fa0c0; }
  .stats-block { display: flex; gap: 20px; align-items: center; }
  .stat-item { text-align: right; }
  .stat-label { font-size: 0.65rem; color: #00f0ff; letter-spacing: 1px; text-transform: uppercase; }
  .stat-val { font-size: 1.1rem; font-weight: 700; color: #fff; }

  /* Wind Indicator */
  .wind-compass { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.2); }
  .wind-arrow { width: 22px; height: 22px; transition: transform 0.3s ease; }

  /* Notification Banner */
  .status-banner { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); padding: 10px 24px; text-align: center; border-radius: 30px; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; border: 1px solid #00f0ff; background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); transition: all 0.3s ease; }
  
  /* Floating Countdown Overlay */
  .countdown-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 900; letter-spacing: 4px; color: #ffe600; text-shadow: 0 0 30px rgba(255, 230, 0, 0.8); display: none; pointer-events: none; }

  /* Control Panels */
  .bottom-dock { display: flex; justify-content: space-between; align-items: flex-end; gap: 15px; }
  
  /* Archetype Picker */
  .rocket-selector { display: flex; gap: 8px; padding: 8px; border-radius: 10px; }
  .rocket-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #ccc; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.2s ease; }
  .rocket-btn.active { background: rgba(0, 240, 255, 0.25); border-color: #00f0ff; color: #fff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

  /* Dual Sliders */
  .sliders-panel { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; width: 290px; }
  .slider-row { display: flex; flex-direction: column; gap: 6px; }
  .slider-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #8fa0c0; text-transform: uppercase; }
  .slider-val { color: #00f0ff; font-weight: 700; }
  
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #00f0ff; cursor: pointer; box-shadow: 0 0 12px #00f0ff; }

  /* Launch Button */
  .launch-btn-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .launch-btn { background: linear-gradient(135deg, #ff5e00, #ff1a00); color: #fff; border: 2px solid #ff9900; font-size: 1.25rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; padding: 18px 45px; border-radius: 50px; cursor: pointer; box-shadow: 0 0 35px rgba(255, 90, 0, 0.55); transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .launch-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 90, 0, 0.8); }
  .launch-btn:active { transform: scale(0.96); }
  .launch-btn:disabled { background: #333; border-color: #555; color: #777; box-shadow: none; cursor: not-allowed; }

  /* Modal Win/Lose */
  .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 16, 0.85); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; pointer-events: auto; }
  .modal-card { text-align: center; padding: 35px 45px; max-width: 420px; border-radius: 16px; border: 2px solid #00f0ff; }
  .modal-card h2 { font-size: 2rem; color: #00f0ff; text-transform: uppercase; margin-bottom: 8px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
  .stars-row { font-size: 2.2rem; margin: 15px 0; color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
  .modal-action-btn { margin-top: 20px; background: #00f0ff; color: #050811; font-weight: 800; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 1rem; transition: transform 0.2s; }
  .modal-action-btn:hover { transform: scale(1.05); }

  /* Score Popup in 3D overlay */
  .floating-score { position: absolute; font-weight: 900; font-size: 1.8rem; color: #00ff66; text-shadow: 0 0 15px #00ff66; pointer-events: none; animation: floatUp 1.2s forwards; }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); } 50% { transform: translate(-50%, -40px) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud-layer">
  <!-- Top Bar -->
  <div class="top-bar glass-panel interactive">
    <div class="title-block">
      <h1>Orbit Strike AR</h1>
      <p id="level-title">WORLD 1 — MOJAVE RANGE (LEVEL 1)</p>
    </div>
    <div class="wind-compass">
      <span style="font-size:0.75rem; color:#8fa0c0;">WIND</span>
      <svg class="wind-arrow" id="wind-arrow" viewBox="0 0 24 24" fill="#00f0ff"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
      <span id="wind-speed" style="font-size:0.8rem; font-weight:700;">2.4 m/s</span>
    </div>
    <div class="stats-block">
      <div class="stat-item">
        <div class="stat-label">Rockets</div>
        <div class="stat-val" id="rockets-count">🚀 🚀 🚀</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Score</div>
        <div class="stat-val" id="score-val">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Coins</div>
        <div class="stat-val" id="coins-val">🪙 250</div>
      </div>
    </div>
  </div>

  <!-- Status Notification -->
  <div class="status-banner" id="status-banner">TAP SURFACE TO DEPLOY LAUNCH PAD</div>

  <!-- Countdown Overlay -->
  <div class="countdown-overlay" id="countdown-overlay">3</div>

  <!-- Bottom Dock -->
  <div class="bottom-dock">
    <!-- Archetypes -->
    <div class="rocket-selector glass-panel interactive">
      <button class="rocket-btn active" onclick="selectRocket('Basic')">STRIKE-1<br><span style="font-size:0.6rem;opacity:0.7">BALANCED</span></button>
      <button class="rocket-btn" onclick="selectRocket('Heavy')">TITAN-IV<br><span style="font-size:0.6rem;opacity:0.7">HEAVY BLAST</span></button>
      <button class="rocket-btn" onclick="selectRocket('Speedster')">VELOCITY-X<br><span style="font-size:0.6rem;opacity:0.7">HIGH SPEED</span></button>
      <button class="rocket-btn" onclick="selectRocket('Precision')">HAWK-EYE<br><span style="font-size:0.6rem;opacity:0.7">FIN STABLE</span></button>
    </div>

    <!-- Sliders -->
    <div class="sliders-panel glass-panel interactive">
      <div class="slider-row">
        <div class="slider-header">
          <span>Launch Force (Thrust)</span>
          <span class="slider-val" id="force-val">75%</span>
        </div>
        <input type="range" id="force-slider" min="20" max="100" value="75">
      </div>
      <div class="slider-row">
        <div class="slider-header">
          <span>Launch Pitch Angle</span>
          <span class="slider-val" id="angle-val">45°</span>
        </div>
        <input type="range" id="angle-slider" min="15" max="85" value="45">
      </div>
      <div class="slider-row">
        <div class="slider-header">
          <span>Direction Azimuth (Yaw)</span>
          <span class="slider-val" id="yaw-val">0°</span>
        </div>
        <input type="range" id="yaw-slider" min="-60" max="60" value="0">
      </div>
    </div>

    <!-- Big Launch Button -->
    <div class="launch-btn-container interactive">
      <button class="launch-btn" id="launch-btn" onclick="triggerLaunchSequence()" disabled>LAUNCH</button>
      <button class="glass-panel interactive" style="padding: 6px 16px; font-size:0.75rem; color:#8fa0c0; border:none; border-radius:20px; cursor:pointer;" onclick="resetPlacement()">Relocate Pad</button>
    </div>
  </div>
</div>

<!-- Win Modal -->
<div class="modal-overlay" id="win-modal">
  <div class="modal-card glass-panel">
    <h2>TARGET ANNIHILATED!</h2>
    <div class="stars-row" id="stars-display">★★★</div>
    <p id="win-summary" style="color:#8fa0c0; margin-bottom: 10px;">Direct Bullseye Hit!</p>
    <div style="font-size:1.3rem; font-weight:700; color:#fff; margin-bottom:15px;" id="win-score">+100 PTS • +300 COINS</div>
    <button class="modal-action-btn" onclick="nextLevel()">NEXT LEVEL →</button>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER (WEB AUDIO API) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playBeep(freq = 880, duration = 0.12, type = 'sine') {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playExplosionSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 0.8;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * (i / bufferSize));
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(450, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
  noise.connect(filter);
  filter.connect(audioCtx.destination);
  noise.start();
}

function playLaunchRoar() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playBeep(220, 0.4, 'sawtooth');
}

// --- THREE.JS 3D WORLD ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050811, 0.035);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3.5, 7.5);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x223355, 1.2);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.5);
dirLight.position.set(5, 12, 6);
dirLight.castShadow = true;
scene.add(dirLight);

const cyanBeacon = new THREE.PointLight(0x00f0ff, 2, 10);
scene.add(cyanBeacon);

// Holographic AR Grid Plane
const gridHelper = new THREE.GridHelper(30, 60, 0x00f0ff, 0x112244);
gridHelper.position.y = 0;
scene.add(gridHelper);

// AR Reticle
const reticle = new THREE.Group();
const ringGeo1 = new THREE.RingGeometry(0.5, 0.56, 32);
const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = -Math.PI / 2;
reticle.add(ring1);

const ringGeo2 = new THREE.RingGeometry(0.25, 0.3, 32);
const ring2 = new THREE.Mesh(ringGeo2, ringMat1);
ring2.rotation.x = -Math.PI / 2;
reticle.add(ring2);
scene.add(reticle);

// Game State
let isPadPlaced = false;
let currentLevel = 1;
let score = 0;
let coins = 250;
let rocketsRemaining = 3;
let activeRocketType = 'Basic';
let launchForce = 0.75;
let launchAngle = 45;
let launchYaw = 0;
let windVector = new THREE.Vector3(0.6, 0, 0);
let windSpeed = 2.4;

// Pad & Rocket objects
let padGroup = new THREE.Group();
let gantryRail = new THREE.Group();
let rocketMesh = null;
let targetMesh = null;
let activeFlightRocket = null;
let trajectoryLine = null;
let debrisParticles = [];

// Rocket Archetype Specs
const ROCKET_STATS = {
  Basic: { mass: 2.0, thrust: 42, burn: 2.2, color: 0x00f0ff },
  Heavy: { mass: 4.2, thrust: 68, burn: 3.0, color: 0xff8800 },
  Speedster: { mass: 1.2, thrust: 58, burn: 1.4, color: 0x00ff88 },
  Precision: { mass: 1.8, thrust: 38, burn: 2.8, color: 0xff00cc }
};

// --- BUILD PROCEDURAL ASSETS ---
function createRocketModel(colorHex) {
  const group = new THREE.Group();
  
  // Body cylinder
  const bodyGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.6, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.25;
  group.add(body);

  // Nose cone
  const noseGeo = new THREE.ConeGeometry(0.08, 0.22, 16);
  const noseMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.3 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.position.y = 0.61;
  group.add(nose);

  // 4 Fins
  for (let i = 0; i < 4; i++) {
    const finGeo = new THREE.BoxGeometry(0.015, 0.15, 0.1);
    const finMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.3 });
    const fin = new THREE.Mesh(finGeo, finMat);
    fin.rotation.y = (i * Math.PI) / 2;
    fin.position.y = 0.1;
    fin.translateZ(0.08);
    group.add(fin);
  }

  // Engine nozzle
  const nozzleGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.06, 16);
  const nozzleMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const nozzle = new THREE.Mesh(nozzleGeo, nozzleMat);
  nozzle.position.y = -0.02;
  group.add(nozzle);

  return group;
}

function createLaunchPad() {
  const pad = new THREE.Group();

  // Base platform
  const baseGeo = new THREE.CylinderGeometry(0.7, 0.75, 0.08, 24);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a2233, metalness: 0.8, roughness: 0.2 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  pad.add(base);

  // Runway ring lights
  for (let i = 0; i < 8; i++) {
    const lightGeo = new THREE.SphereGeometry(0.03, 8, 8);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    const beacon = new THREE.Mesh(lightGeo, lightMat);
    const ang = (i * Math.PI * 2) / 8;
    beacon.position.set(Math.cos(ang) * 0.6, 0.05, Math.sin(ang) * 0.6);
    pad.add(beacon);
  }

  // Gantry rail (tilts pitch & yaw)
  gantryRail = new THREE.Group();
  const railGeo = new THREE.BoxGeometry(0.05, 0.8, 0.05);
  const railMat = new THREE.MeshStandardMaterial({ color: 0x445566 });
  const rail = new THREE.Mesh(railGeo, railMat);
  rail.position.y = 0.4;
  gantryRail.add(rail);

  pad.add(gantryRail);
  return pad;
}

function createBullseyeTarget(pos) {
  const target = new THREE.Group();
  target.position.copy(pos);

  // Outer ring (25 pts)
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.04, 32), new THREE.MeshStandardMaterial({ color: 0xffaa00 }));
  target.add(outer);

  // Middle ring (50 pts)
  const middle = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.06, 32), new THREE.MeshStandardMaterial({ color: 0x00f0ff }));
  middle.position.y = 0.02;
  target.add(middle);

  // Bullseye core (100 pts)
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 32), new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 0.5 }));
  core.position.y = 0.04;
  target.add(core);

  scene.add(target);
  return target;
}

// Trajectory Line
const maxTrajPoints = 60;
const trajPositions = new Float32Array(maxTrajPoints * 3);
const trajGeo = new THREE.BufferGeometry();
trajGeo.setAttribute('position', new THREE.BufferAttribute(trajPositions, 3));
const trajMat = new THREE.LineDashedMaterial({ color: 0x00f0ff, dashSize: 0.15, gapSize: 0.1, linewidth: 2 });
trajectoryLine = new THREE.Line(trajGeo, trajMat);
trajectoryLine.computeLineDistances();
scene.add(trajectoryLine);

// --- INTERACTION & PLACEMENT ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('click', (e) => {
  if (e.target.closest('.interactive')) return;

  if (!isPadPlaced) {
    raycaster.setFromCamera(mouse, camera);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, hit)) {
      placeLaunchPad(hit);
    }
  }
});

function placeLaunchPad(pos) {
  isPadPlaced = true;
  padGroup = createLaunchPad();
  padGroup.position.copy(pos);
  scene.add(padGroup);

  cyanBeacon.position.copy(pos).add(new THREE.Vector3(0, 1, 0));

  // Spawn Rocket
  spawnRocket();

  // Spawn Target 5.5 units forward
  if (targetMesh) scene.remove(targetMesh);
  targetMesh = createBullseyeTarget(pos.clone().add(new THREE.Vector3(0, 0, -5.5)));

  reticle.visible = false;
  document.getElementById('status-banner').innerText = "TUNE FORCE & ANGLE, THEN LAUNCH!";
  document.getElementById('launch-btn').disabled = false;
  updateTrajectory();
}

function spawnRocket() {
  if (rocketMesh) gantryRail.remove(rocketMesh);
  rocketMesh = createRocketModel(ROCKET_STATS[activeRocketType].color);
  rocketMesh.position.set(0, 0.1, 0);
  gantryRail.add(rocketMesh);
}

function resetPlacement() {
  if (padGroup) scene.remove(padGroup);
  if (targetMesh) scene.remove(targetMesh);
  isPadPlaced = false;
  reticle.visible = true;
  document.getElementById('status-banner').innerText = "TAP SURFACE TO DEPLOY LAUNCH PAD";
  document.getElementById('launch-btn').disabled = true;
}

function selectRocket(type) {
  activeRocketType = type;
  document.querySelectorAll('.rocket-btn').forEach(b => b.classList.remove('active'));
  event.target.closest('.rocket-btn').classList.add('active');
  playBeep(600, 0.08);
  if (isPadPlaced) spawnRocket();
  updateTrajectory();
}

// Sliders Event Handlers
document.getElementById('force-slider').addEventListener('input', (e) => {
  launchForce = e.target.value / 100;
  document.getElementById('force-val').innerText = `${e.target.value}%`;
  updateTrajectory();
});

document.getElementById('angle-slider').addEventListener('input', (e) => {
  launchAngle = parseFloat(e.target.value);
  document.getElementById('angle-val').innerText = `${launchAngle}°`;
  updateTrajectory();
});

document.getElementById('yaw-slider').addEventListener('input', (e) => {
  launchYaw = parseFloat(e.target.value);
  document.getElementById('yaw-val').innerText = `${launchYaw}°`;
  updateTrajectory();
});

function updateTrajectory() {
  if (!isPadPlaced || !padGroup) return;

  // Update Gantry Rail visual tilt
  gantryRail.rotation.x = -THREE.MathUtils.degToRad(launchAngle);
  gantryRail.rotation.y = THREE.MathUtils.degToRad(launchYaw);

  // Physics Simulation
  const stats = ROCKET_STATS[activeRocketType];
  const mass = stats.mass;
  const maxThrust = stats.thrust;
  const burnTime = stats.burn;

  const pitchRad = THREE.MathUtils.degToRad(launchAngle);
  const yawRad = THREE.MathUtils.degToRad(launchYaw);

  const dir = new THREE.Vector3(
    Math.sin(yawRad) * Math.cos(pitchRad),
    Math.sin(pitchRad),
    -Math.cos(yawRad) * Math.cos(pitchRad)
  ).normalize();

  let simPos = padGroup.position.clone().add(new THREE.Vector3(0, 0.3, 0));
  let simVel = dir.clone().multiplyScalar((maxThrust * launchForce * 0.35) / mass);
  const gravity = new THREE.Vector3(0, -9.81, 0);
  const dt = 0.05;

  const positions = trajectoryLine.geometry.attributes.position.array;
  let simTime = 0;

  for (let i = 0; i < maxTrajPoints; i++) {
    positions[i * 3] = simPos.x;
    positions[i * 3 + 1] = simPos.y;
    positions[i * 3 + 2] = simPos.z;

    simTime += dt;
    let thrust = (simTime <= burnTime) ? dir.clone().multiplyScalar((maxThrust * launchForce) / mass) : new THREE.Vector3();
    let totalAccel = thrust.add(gravity).add(windVector.clone().multiplyScalar(windSpeed * 0.25));

    simVel.add(totalAccel.multiplyScalar(dt));
    simPos.add(simVel.clone().multiplyScalar(dt));

    if (simPos.y < 0) {
      // Clamped to floor
      for (let j = i + 1; j < maxTrajPoints; j++) {
        positions[j * 3] = simPos.x;
        positions[j * 3 + 1] = 0;
        positions[j * 3 + 2] = simPos.z;
      }
      break;
    }
  }

  trajectoryLine.geometry.attributes.position.needsUpdate = true;
  trajectoryLine.computeLineDistances();
}

// --- LAUNCH SEQUENCE ---
function triggerLaunchSequence() {
  if (!isPadPlaced || activeFlightRocket) return;

  document.getElementById('launch-btn').disabled = true;
  const countdownEl = document.getElementById('countdown-overlay');
  countdownEl.style.display = 'block';

  let count = 3;
  countdownEl.innerText = count;
  playBeep(880, 0.15);

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      countdownEl.innerText = count;
      playBeep(880, 0.15);
    } else {
      clearInterval(timer);
      countdownEl.innerText = "LIFTOFF!";
      playBeep(1400, 0.3, 'square');
      playLaunchRoar();
      setTimeout(() => {
        countdownEl.style.display = 'none';
        executeLiftoff();
      }, 400);
    }
  }, 900);
}

function executeLiftoff() {
  rocketsRemaining = Math.max(0, rocketsRemaining - 1);
  updateRocketIcons();

  const stats = ROCKET_STATS[activeRocketType];
  const pitchRad = THREE.MathUtils.degToRad(launchAngle);
  const yawRad = THREE.MathUtils.degToRad(launchYaw);

  const dir = new THREE.Vector3(
    Math.sin(yawRad) * Math.cos(pitchRad),
    Math.sin(pitchRad),
    -Math.cos(yawRad) * Math.cos(pitchRad)
  ).normalize();

  // Clone rocket into world space
  const flying = createRocketModel(stats.color);
  flying.position.copy(padGroup.position).add(new THREE.Vector3(0, 0.3, 0));
  scene.add(flying);
  rocketMesh.visible = false;

  activeFlightRocket = {
    mesh: flying,
    dir: dir,
    vel: dir.clone().multiplyScalar((stats.thrust * launchForce * 0.35) / stats.mass),
    mass: stats.mass,
    thrust: stats.thrust,
    burnTimer: stats.burn,
    time: 0
  };

  document.getElementById('status-banner').innerText = "ROCKET IN FLIGHT...";
}

function updateRocketIcons() {
  let str = "";
  for (let i = 0; i < rocketsRemaining; i++) str += "🚀 ";
  document.getElementById('rockets-count').innerText = str || "EMPTY";
}

// --- EXPLOSIONS & SCORING ---
function spawnExplosion(pos) {
  playExplosionSound();

  // Create shockwave ring
  const ringGeo = new THREE.RingGeometry(0.1, 0.3, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide });
  const shock = new THREE.Mesh(ringGeo, ringMat);
  shock.rotation.x = -Math.PI / 2;
  shock.position.copy(pos).add(new THREE.Vector3(0, 0.05, 0));
  scene.add(shock);

  // Debris fragments
  for (let i = 0; i < 18; i++) {
    const pGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
    const pMat = new THREE.MeshBasicMaterial({ color: (i % 2 === 0) ? 0x00f0ff : 0xff5500 });
    const p = new THREE.Mesh(pGeo, pMat);
    p.position.copy(pos);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 6,
      Math.random() * 5 + 2,
      (Math.random() - 0.5) * 6
    );
    scene.add(p);
    debrisParticles.push({ mesh: p, vel: vel, life: 1.0 });
  }

  // Animate shockwave
  let expand = 0;
  const shockTimer = setInterval(() => {
    expand += 0.15;
    shock.scale.set(1 + expand * 4, 1 + expand * 4, 1);
    shock.material.opacity = 1 - expand;
    if (expand >= 1) {
      clearInterval(shockTimer);
      scene.remove(shock);
    }
  }, 30);
}

function checkImpact(rocketPos) {
  if (!targetMesh) return;

  const targetCenter = targetMesh.position;
  const dist = rocketPos.distanceTo(targetCenter);

  spawnExplosion(rocketPos);
  scene.remove(activeFlightRocket.mesh);
  activeFlightRocket = null;

  if (dist < 1.35) {
    let pts = (dist < 0.45) ? 100 : (dist < 0.85) ? 50 : 25;
    score += pts;
    document.getElementById('score-val').innerText = score;

    showWinModal(pts);
  } else {
    // Missed
    document.getElementById('status-banner').innerText = "MISSED TARGET! TRY AGAIN.";
    setTimeout(() => {
      if (rocketsRemaining > 0) {
        rocketMesh.visible = true;
        document.getElementById('launch-btn').disabled = false;
        document.getElementById('status-banner').innerText = "TUNE FORCE & ANGLE, THEN LAUNCH!";
      } else {
        document.getElementById('status-banner').innerText = "OUT OF ROCKETS! RELOADING...";
        setTimeout(() => { rocketsRemaining = 3; updateRocketIcons(); rocketMesh.visible = true; document.getElementById('launch-btn').disabled = false; }, 2000);
      }
    }, 1500);
  }
}

function showWinModal(pts) {
  const modal = document.getElementById('win-modal');
  modal.style.display = 'flex';
  document.getElementById('win-score').innerText = `+${pts} PTS • +300 COINS`;
  coins += 300;
  document.getElementById('coins-val').innerText = `🪙 ${coins}`;
}

function nextLevel() {
  document.getElementById('win-modal').style.display = 'none';
  currentLevel++;
  document.getElementById('level-title').innerText = `WORLD 1 — MOJAVE RANGE (LEVEL ${currentLevel})`;
  rocketsRemaining = 3;
  updateRocketIcons();
  rocketMesh.visible = true;
  document.getElementById('launch-btn').disabled = false;

  // Move target slightly further
  if (targetMesh && padGroup) {
    targetMesh.position.copy(padGroup.position).add(new THREE.Vector3(
      (Math.random() - 0.5) * 1.5,
      0,
      -(5.5 + currentLevel * 0.8)
    ));
  }
  updateTrajectory();
}

// --- ANIMATION LOOP ---
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  // Reticle tracking
  if (!isPadPlaced) {
    raycaster.setFromCamera(mouse, camera);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, hit)) {
      reticle.position.copy(hit);
      reticle.position.y = 0.01;
    }
    ring1.rotation.z += 0.02;
    ring2.rotation.z -= 0.03;
  }

  // Flight simulation
  if (activeFlightRocket) {
    const r = activeFlightRocket;
    r.time += delta;

    let thrust = new THREE.Vector3();
    if (r.time <= r.burnTimer) {
      thrust = r.dir.clone().multiplyScalar((r.thrust * launchForce) / r.mass);
    }

    const gravity = new THREE.Vector3(0, -9.81, 0);
    const accel = thrust.add(gravity).add(windVector.clone().multiplyScalar(windSpeed * 0.25));

    r.vel.add(accel.multiplyScalar(delta));
    r.mesh.position.add(r.vel.clone().multiplyScalar(delta));

    // Align nose with velocity
    if (r.vel.lengthSq() > 0.1) {
      const targetLook = r.mesh.position.clone().add(r.vel);
      r.mesh.lookAt(targetLook);
      r.mesh.rotateX(Math.PI / 2);
    }

    // Follow camera
    camera.position.lerp(r.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 3.5)), 0.08);
    camera.lookAt(r.mesh.position);

    // Floor impact check
    if (r.mesh.position.y <= 0.05) {
      checkImpact(r.mesh.position);
    }
  } else if (isPadPlaced) {
    // Return camera smoothly to pad overview
    const desiredCamPos = padGroup.position.clone().add(new THREE.Vector3(0, 3.0, 5.5));
    camera.position.lerp(desiredCamPos, 0.05);
    camera.lookAt(padGroup.position.clone().add(new THREE.Vector3(0, 0.8, -2.5)));
  }

  // Debris physics update
  for (let i = debrisParticles.length - 1; i >= 0; i--) {
    const dp = debrisParticles[i];
    dp.life -= delta * 1.2;
    dp.vel.y -= 9.81 * delta;
    dp.mesh.position.add(dp.vel.clone().multiplyScalar(delta));
    dp.mesh.rotation.x += 0.1;
    if (dp.mesh.position.y <= 0) dp.mesh.position.y = 0;

    if (dp.life <= 0) {
      scene.remove(dp.mesh);
      debrisParticles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
