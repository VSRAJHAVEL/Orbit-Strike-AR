<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SKYFALL: AR Rocket Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070c;
        font-family: 'Rajdhani', sans-serif;
        color: #e2e8f0;
      }
      #canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #hud-root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }
      .pointer-auto {
        pointer-events: auto;
      }
      .glass-panel {
        background: rgba(10, 16, 26, 0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(0, 240, 255, 0.18);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      }
      .font-orbitron {
        font-family: 'Orbitron', monospace;
      }
      .glow-cyan {
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.65);
      }
      .glow-gold {
        text-shadow: 0 0 10px rgba(255, 180, 0, 0.65);
      }
      .btn-cyber {
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 140, 255, 0.08));
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #00f0ff;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        letter-spacing: 1px;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .btn-cyber:hover {
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(0, 140, 255, 0.2));
        border-color: #00f0ff;
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
        transform: translateY(-1px);
      }
      .btn-cyber:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
